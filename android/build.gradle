buildscript {
  ext.getExtOrDefault = { name, fallback ->
    rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.1.4"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion', '1.9.24')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

android {
  namespace "com.maksbas"
  compileSdk getExtOrDefault("compileSdkVersion", 34) as Integer

  defaultConfig {
    minSdk getExtOrDefault("minSdkVersion", 23) as Integer
    targetSdk getExtOrDefault("targetSdkVersion", 34) as Integer
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  lintOptions {
    disable "GradleCompatible"
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"

  // The Firebase BoM keeps the messaging artifact on a version that matches
  // whatever google-services plugin the host app applies.
  implementation platform("com.google.firebase:firebase-bom:${getExtOrDefault('firebaseBomVersion', '33.7.0')}")
  implementation "com.google.firebase:firebase-messaging"

  implementation "androidx.core:core-ktx:1.13.1"
}
