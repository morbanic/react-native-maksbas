buildscript {
  ext.getExtOrDefault = { name, fallback ->
    rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
  }

  repositories {
    google()
    mavenCentral()
  }

  // Only used when this module is built on its own. Inside an app the root
  // project already puts these on the classpath, and its versions win — so the
  // defaults track what the current React Native template ships.
  dependencies {
    classpath "com.android.tools.build:gradle:8.12.0"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion', '2.1.20')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

android {
  namespace "com.maksbas"
  compileSdk getExtOrDefault("compileSdkVersion", 36) as Integer

  defaultConfig {
    minSdk getExtOrDefault("minSdkVersion", 24) as Integer
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  lint {
    disable "GradleCompatible"
  }
}

kotlin {
  compilerOptions {
    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"

  // The Firebase BoM keeps the messaging artifact on a version that matches
  // whatever google-services plugin the host app applies.
  implementation platform("com.google.firebase:firebase-bom:${getExtOrDefault('firebaseBomVersion', '34.4.0')}")
  implementation "com.google.firebase:firebase-messaging"

  implementation "androidx.core:core-ktx:1.17.0"
}
